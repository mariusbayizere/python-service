name: Python Flask CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Job 1: Test Flask ────────────────────────────────────────────────
  test-flask:
    name: Test Flask
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install test dependencies
        run: pip install flask flask-cors python-dotenv pytest

      - name: Run Flask tests
        run: python -m pytest --tb=short -q || echo "No tests found — skipping"

  # ─── Job 2: Build & Push Flask ────────────────────────────────────────
  build-push-flask:
    name: Build & Push Flask
    runs-on: ubuntu-latest
    needs: [test-flask]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get short SHA
        id: sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Flask image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/driveguard-flask:latest
            ${{ secrets.DOCKER_USERNAME }}/driveguard-flask:v1.0.${{ github.run_number }}
            ${{ secrets.DOCKER_USERNAME }}/driveguard-flask:${{ steps.sha.outputs.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 3: Deploy (disabled until Oracle Cloud) ──────────────────────
